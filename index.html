<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オリジナルビンゴカード生成</title>
  <!-- 画面を画像化するための外部ライブラリを読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* 画面全体の中央揃え設定 */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      max-width: 1000px;
      margin: 0 auto !important;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      color: #e91e63;
      width: 100%;
      margin-bottom: 25px;
    }

    .controls {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 25px;
      width: 100%;
      box-sizing: border-box;
    }

    .options {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    select, button {
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #ff4081;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #f50057;
    }

    .btn-secondary {
      background-color: #757575;
    }

    .btn-secondary:hover {
      background-color: #616161;
    }

    /* 拡大ボタンの追加スタイル */
    .btn-zoom {
      background-color: #2196F3;
    }

    .btn-zoom:hover {
      background-color: #1976D2;
    }

    /* 画像保存ボタンの追加スタイル */
    .btn-save {
      background-color: #4CAF50;
    }

    .btn-save:hover {
      background-color: #388E3C;
    }

    /* 注意書きトグルボタンの追加スタイル */
    .btn-info {
      background-color: #ff9800;
    }

    .btn-info:hover {
      background-color: #f57c00;
    }

    /* 項目リストトグルボタンの追加スタイル */
    .btn-toggle-list {
      background-color: #00bcd4;
    }

    .btn-toggle-list:hover {
      background-color: #00acc1;
    }

    /* 項目リストの表示エリア（初期状態は非表示） */
    .item-list-wrapper {
      display: none;
      margin-top: 15px;
    }

    .item-list-container {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px;
      background: #fafafa;
      margin-top: 10px;
      margin-bottom: 15px;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .item-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .item-row input[type="text"] {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .num-input {
      width: 45px;
      padding: 4px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    
    /* 項目追加エリア（一時的に非表示設定） */
    .add-item-box {
      display: none;
      gap: 8px;
      margin-bottom: 12px;
    }

    .add-item-box input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* 注意書き表示エリア（デフォルトで非表示） */
    .note {
      display: none;
      font-size: 13px;
      color: #555;
      margin-top: 15px;
      padding: 12px 15px;
      background-color: #fff8e1;
      border-left: 4px solid #ffb300;
      border-radius: 4px;
      line-height: 1.6;
    }

    .item-count-badge {
      font-size: 13px;
      color: #666;
      font-weight: normal;
      margin-left: 8px;
    }
    
    /* ビンゴカード表示エリア（中央寄せ固定） */
    .card-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 25px;
    }

    .bingo-card {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 1 / 1;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      user-select: none;
      margin: 0 auto;
      background-color: #ffffff;
    }
    
    /* 5x5用 */
    .bingo-card.mode-5x5 {
      background-image: url('bingo1.png');
    }

    .bingo-card.mode-5x5 .grid-overlay {
      top: 15.2%;
      left: 12.8%;
      width: 74.4%;
      height: 70.2%;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 1.5%;
    }

    /* 4x4用 */
    .bingo-card.mode-4x4 {
      background-image: url('bingo2.png');
    }

    .bingo-card.mode-4x4 .grid-overlay {
      top: 15.5%;
      left: 12.5%;
      width: 72.0%;
      height: 64.0%;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 2.0%;
    }

    .bingo-card.mode-4x4 .cell {
      margin: 2px;
    }

    .grid-overlay {
      position: absolute;
      display: grid;
      box-sizing: border-box;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2px;
      font-size: clamp(9px, 1.5vw, 14px);
      font-weight: bold;
      color: #222;
      line-height: 1.25;
      word-break: break-all;
      cursor: pointer;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      white-space: pre-line;
    }
    
    .cell.checked::after {
      content: "★";
      position: absolute;
      inset: 0;
      background: rgba(255, 64, 129, 0.65);
      border: 3px solid #ff0055;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: clamp(20px, 4.5vw, 36px);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }

    /* モーダル（全画面拡大表示エリア） */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-overlay .bingo-card,
    .modal-overlay img.generated-img {
      width: 90vh;
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
    }

    /* モーダル拡大表示時も通常表示と同じ比率にする */
    .modal-overlay .cell {
      font-size: inherit;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: #e91e63;
      color: white;
      border: none;
      font-size: 16px;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 50px;
      cursor: pointer;
      z-index: 10000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    @media print {
      .controls, .modal-overlay { display: none; }
      body { background: white; padding: 0; }
      .bingo-card { max-width: 100%; }
    }
  </style>
</head>
<body>

  <h1>ビンゴカード生成器</h1>

  <div class="controls">
    <div class="options">
      <div>
        <label for="mode-select" style="font-weight:bold;">サイズ:</label>
        <select id="mode-select" onchange="generateBingo()">
          <option value="5x5">5×5（25マス - bingo1.png）</option>
          <option value="4x4">4×4（16マス - bingo2.png）</option>
        </select>
      </div>

      <div id="free-option-group">
        <label style="font-weight:bold;"><input type="checkbox" id="use-free" checked onchange="generateBingo()"> 中央をFREEにする</label>
      </div>

      <button onclick="generateBingo()">シャッフルして生成</button>
      <button class="btn-save" onclick="downloadBingoImage()">画像として表示/保存</button>
      <button class="btn-zoom" onclick="openModal()">拡大表示</button>
      <button class="btn-toggle-list" id="btn-toggle-items" onclick="toggleItemList()">項目リスト表示 <span id="checked-count-badge" class="item-count-badge"></span></button>
      <button class="btn-info" onclick="toggleNote()">注意書き表示</button>
    </div>

    <div>
      <!-- 展開可能な項目エリア -->
      <div id="item-list-wrapper" class="item-list-wrapper">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <label style="font-weight:bold;">マスに入れる項目（□でレ点オンオフ / 数字指定可能）:</label>
          <div>
            <button class="btn-secondary" style="padding: 4px 8px; font-size:12px;" onclick="setAllCheckboxes(true)">全チェック</button>
            <button class="btn-secondary" style="padding: 4px 8px; font-size:12px;" onclick="setAllCheckboxes(false)">全解除</button>
          </div>
        </div>

        <!-- 新規項目追加（CSSにより非表示中） -->
        <div class="add-item-box">
          <input type="text" id="new-item-text" placeholder="新しい項目を入力...（例: ★1[武器種]縛り）">
          <button type="button" onclick="addNewItem()">項目を追加</button>
        </div>

        <div id="item-list-container" class="item-list-container">
          <!-- JSで項目行を自動生成 -->
        </div>
      </div>

      <!-- 注意書きエリア（ボタンクリックで切り替え） -->
      <div class="note" id="note-area">
        ※ <code>[武器種]</code> は「【シューター】」などのランダムな武器種になります。<br>
        ※ <code>[ガジェット]</code> は「【スピードタンク】」「【パワータンク】」「【テクニカルタンク】」のランダムになります。<br>
        ※ <code>[欠片]</code> は「５０００～１００００」のランダムな個数になります。<br>
        ※ <code>[ランク]</code> は「Ａ」「Ｂ」「Ｃ」のランダムになります。<br>
        ※ <code>[デカ結晶数]</code> は「１～１０回」、<code>[討伐数]</code> は「１～２０体」、<code>[階数]</code> は「３～１５階分」のランダムになります。<br>
        ※ <code>[秒数]</code> は「３０～５０秒」のランダムになります。<br>
        ※ チェックを入れた項目（?）のみがビンゴカードの作成に使用されます。
      </div>
    </div>
  </div>

  <div class="card-wrapper" id="normal-card-wrapper">
    <div id="bingo-card" class="bingo-card mode-5x5">
      <div id="grid-overlay" class="grid-overlay"></div>
    </div>
  </div>

  <!-- 拡大表示・画像出力用モーダル -->
  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <button class="close-btn" onclick="closeModal(event)">閉じる (Esc)</button>
    <div id="modal-content" style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;"></div>
  </div>

  <script>
    let itemList = [
      { id: 1, text: "★5武器", count: 1, type: "weapon_count", suffix: "本獲得 [武器種]", checked: true },
      { id: 2, text: "★5絶品武器", count: 2, type: "weapon_count", suffix: "本獲得 [武器種]", checked: true },
      { id: 3, text: "★5絶品武器", count: 3, type: "weapon_count", suffix: "本獲得 [武器種]", checked: true },
      { id: 4, text: "ガジェット縛り[ガジェット]", type: "normal", checked: true },
      { id: 5, text: "クリスタルの欠片[欠片]個集める", type: "normal", checked: true },
      { id: 6, text: "ミニゲームで[ランク]をとる", type: "normal", checked: true },
      { id: 7, text: "[武器種]でステージクリア", type: "normal", checked: true },
      { id: 8, text: "[武器種]で１０キル", type: "normal", checked: true },
      { id: 9, text: "アンナン巣窟[秒数]秒以内クリア", type: "normal", checked: true },
      { id: 10, text: "幻のシャケ３体討伐", type: "normal", checked: true },
      { id: 11, text: "★1武器縛り[武器種]", type: "normal", checked: true },
      { id: 12, text: "味方をナイスで応援", type: "normal", checked: true },
      { id: 13, text: "★１[武器種]で敵を撃破", type: "normal", checked: true },
      { id: 14, text: "★２[武器種]で敵を撃破", type: "normal", checked: true },
      { id: 15, text: "イカロールで敵を落とす", type: "normal", checked: true },
      { id: 16, text: "イカロールアタックのみで１体倒す", type: "normal", checked: true },
      { id: 17, text: "ウズシオクリスタル１０個獲得", type: "normal", checked: true },
      { id: 18, text: "つまみぐいダンジョン１ステージクリア", type: "normal", checked: true },
      { id: 19, text: "フルコーススピードの極味の攻略", type: "normal", checked: true },
      { id: 20, text: "フルコーステクニカルの極味の攻略", type: "normal", checked: true },
      { id: 21, text: "フルコースパワーの極味の攻略", type: "normal", checked: true },
      { id: 22, text: "デカ結晶[デカ結晶数]回クリア", type: "normal", checked: true },
      { id: 23, text: "キワモノシャケ[討伐数]体討伐", type: "normal", checked: true },
      { id: 24, text: "★３[武器種]で敵を撃破", type: "normal", checked: true },
      { id: 25, text: "★４[武器種]で敵を撃破", type: "normal", checked: true },
      { id: 26, text: "★５[武器種]で敵を撃破", type: "normal", checked: true },
      { id: 27, text: "ウデジマン[討伐数]体討伐", type: "normal", checked: true },
      { id: 28, text: "無限食堂[階数]階分進む", type: "normal", checked: true }
    ];

    const WEAPON_TYPES = [
      '【シューター】', '【ローラー】', '【チャージャー】', '【スロッシャー】',
      '【スピナー】', '【マニューバー】', '【シェルター】', '【ブラスター】',
      '【フデ】', '【ストリンガー】', '【ワイパー】'
    ];

    const GADGET_TYPES = [
      '【スピードタンク】', '【パワータンク】', '【テクニカルタンク】'
    ];

    // 入力フォームの生成とバッジ更新
    function renderItemList() {
      const container = document.getElementById('item-list-container');
      container.innerHTML = '';

      itemList.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'item-row';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.checked;
        checkbox.addEventListener('change', (e) => {
          item.checked = e.target.checked;
          updateCheckedBadge();
        });

        row.appendChild(checkbox);

        if (item.type === 'weapon_count') {
          const label1 = document.createElement('span');
          label1.textContent = item.text || '★5武器';
          
          const numInput = document.createElement('input');
          numInput.type = 'number';
          numInput.className = 'num-input';
          numInput.value = item.count;
          numInput.min = 1;
          numInput.max = 99;
          numInput.addEventListener('input', (e) => {
            item.count = e.target.value;
          });

          const label2 = document.createElement('span');
          label2.textContent = (item.suffix || '');

          row.appendChild(label1);
          row.appendChild(numInput);
          row.appendChild(label2);
        } else {
          const textInput = document.createElement('input');
          textInput.type = 'text';
          textInput.value = item.text;
          textInput.addEventListener('input', (e) => {
            item.text = e.target.value;
          });

          row.appendChild(textInput);
        }

        container.appendChild(row);
      });

      updateCheckedBadge();
    }

    // 選択中件数バッジの更新
    function updateCheckedBadge() {
      const checkedCount = itemList.filter(i => i.checked).length;
      const badge = document.getElementById('checked-count-badge');
      if (badge) {
        badge.textContent = `(${checkedCount}件)`;
      }
    }

    // 全チェック / 全解除 ボタン
    function setAllCheckboxes(status) {
      itemList.forEach(item => item.checked = status);
      renderItemList();
    }

    // 項目リストの表示/非表示切り替え関数
    function toggleItemList() {
      const wrapper = document.getElementById('item-list-wrapper');
      const btn = document.getElementById('btn-toggle-items');
      
      if (wrapper.style.display === 'block') {
        wrapper.style.display = 'none';
        btn.childNodes[0].nodeValue = '項目リスト表示 ';
      } else {
        wrapper.style.display = 'block';
        btn.childNodes[0].nodeValue = '項目リストを隠す ';
      }
    }

    // 注意書きの表示/非表示切り替え関数
    function toggleNote() {
      const note = document.getElementById('note-area');
      if (note.style.display === 'block') {
        note.style.display = 'none';
      } else {
        note.style.display = 'block';
      }
    }

    // 新規項目追加
    function addNewItem() {
      const input = document.getElementById('new-item-text');
      const val = input.value.trim();
      if (!val) return;

      itemList.push({
        id: Date.now(),
        text: val,
        type: "normal",
        checked: true
      });

      input.value = '';
      renderItemList();
    }

    // 半角の数字・英字を全角に変換するヘルパー関数
    function toFullWidth(str) {
      return String(str).replace(/[0-9a-zA-Z]/g, (s) => {
        return String.fromCharCode(s.charCodeAt(0) + 0xFEE0);
      });
    }

    // 特殊タグをランダム数値や文字列に置換
    function parseTags(text) {
      text = text.replace(/\[武器種\]/g, () => {
        const randomIndex = Math.floor(Math.random() * WEAPON_TYPES.length);
        return WEAPON_TYPES[randomIndex];
      });

      text = text.replace(/\[ガジェット\]/g, () => {
        const randomIndex = Math.floor(Math.random() * GADGET_TYPES.length);
        return GADGET_TYPES[randomIndex];
      });

      // 欠片: 5000～10000個 (全角数字)
      text = text.replace(/\[欠片\]/g, () => {
        const val = Math.floor(Math.random() * (10000 - 5000 + 1)) + 5000;
        return toFullWidth(val);
      });

      // ランク: A, B, C (全角文字)
      text = text.replace(/\[ランク\]/g, () => {
        const ranks = ['Ａ', 'Ｂ', 'Ｃ'];
        return ranks[Math.floor(Math.random() * ranks.length)];
      });

      // デカ結晶: 1～10回 (全角数字)
      text = text.replace(/\[デカ結晶数\]/g, () => {
        const val = Math.floor(Math.random() * 10) + 1;
        return toFullWidth(val);
      });

      // 討伐数: 1～20体 (全角数字)
      text = text.replace(/\[討伐数\]/g, () => {
        const val = Math.floor(Math.random() * 20) + 1;
        return toFullWidth(val);
      });

      // 無限食堂: 3～15階分 (全角数字)
      text = text.replace(/\[階数\]/g, () => {
        const val = Math.floor(Math.random() * (15 - 3 + 1)) + 3;
        return toFullWidth(val);
      });

      // アンナン巣窟の秒数: 30～50秒 (全角数字)
      text = text.replace(/\[秒数\]/g, () => {
        const val = Math.floor(Math.random() * (50 - 30 + 1)) + 30;
        return toFullWidth(val);
      });

      // 【 の直前と 】 の直後で改行を入れる（先頭の【は除く）
      text = text.replace(/(.)【/g, '$1\n【');
      text = text.replace(/】(.)/g, '】\n$1');

      return text;
    }

    // ビンゴカードの生成
    function generateBingo() {
      const mode = document.getElementById('mode-select').value;
      const useFree = document.getElementById('use-free').checked;
      const card = document.getElementById('bingo-card');
      const grid = document.getElementById('grid-overlay');
      const freeGroup = document.getElementById('free-option-group');

      if (mode === '4x4') {
        card.className = 'bingo-card mode-4x4';
        freeGroup.style.display = 'none';
      } else {
        card.className = 'bingo-card mode-5x5';
        freeGroup.style.display = 'block';
      }

      const selectedItems = [];
      itemList.forEach(item => {
        if (item.checked) {
          if (item.type === 'weapon_count') {
            const num = toFullWidth(item.count || 1);
            const suffix = item.suffix || '';
            selectedItems.push(`${item.text}${num}${suffix}`);
          } else {
            if (item.text.trim().length > 0) {
              selectedItems.push(item.text.trim());
            }
          }
        }
      });

      const totalCells = mode === '5x5' ? 25 : 16;
      const isFreeActive = (mode === '5x5' && useFree);
      const neededItems = isFreeActive ? totalCells - 1 : totalCells;

      if (selectedItems.length < neededItems) {
        alert(`チェックされている項目が足りません。\n${mode}モードでは最低${neededItems}個にチェックを入れてください。（現在: ${selectedItems.length}個）`);
        return;
      }

      const shuffled = [...selectedItems];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      grid.innerHTML = '';
      let itemIdx = 0;

      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');

        if (isFreeActive && i === 12) {
          cell.textContent = 'FREE';
          cell.style.color = '#ff4081';
        } else {
          cell.textContent = parseTags(shuffled[itemIdx]);
          itemIdx++;
        }

        cell.addEventListener('click', () => {
          cell.classList.toggle('checked');
        });

        grid.appendChild(cell);
      }
    }

    // ビンゴカードを画像化
    function downloadBingoImage() {
      const card = document.getElementById('bingo-card');
      
      html2canvas(card, {
        allowTaint: true,
        useCORS: true,
        scale: 2
      }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');

        const link = document.createElement('a');
        link.download = 'bingo_card.png';
        link.href = imgData;
        link.click();

        const modal = document.getElementById('modal-overlay');
        const content = document.getElementById('modal-content');
        content.innerHTML = '';
        
        const img = document.createElement('img');
        img.src = imgData;
        img.className = 'generated-img';
        img.title = '右クリックまたは長押しで保存できます';

        content.appendChild(img);
        modal.classList.add('active');
      }).catch(err => {
        alert('画像の生成に失敗しました。拡大表示ボタンからスクリーンショットをお試しください。');
        console.error(err);
      });
    }

    // 拡大表示モーダルの表示・非表示操作
    function openModal() {
      const modal = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      const card = document.getElementById('bingo-card');
      
      content.innerHTML = '';
      content.appendChild(card);
      modal.classList.add('active');
    }

    function closeModal(event) {
      if (!event || event.target.id === 'modal-overlay' || event.target.classList.contains('close-btn')) {
        const modal = document.getElementById('modal-overlay');
        const wrapper = document.getElementById('normal-card-wrapper');
        const card = document.getElementById('bingo-card');
        
        if (card) {
          wrapper.appendChild(card);
        }
        modal.classList.remove('active');
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal(null);
      }
    });

    // 初期化
    renderItemList();
    generateBingo();
  </script>
</body>
</html>
