<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オリジナルビンゴカード生成</title>
  <style>
    /* 画面全体の中央揃え設定 */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      max-width: 1000px;
      margin: 0 auto !important;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      color: #e91e63;
      width: 100%;
    }

    .controls {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .options {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    select, button {
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #ff4081;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #f50057;
    }

    .btn-secondary {
      background-color: #757575;
    }

    .btn-secondary:hover {
      background-color: #616161;
    }

    /* 項目リストの表示エリア */
    .item-list-container {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px;
      background: #fafafa;
      margin-bottom: 10px;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .item-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .item-row input[type="text"] {
      flex: 1;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .num-input {
      width: 45px;
      padding: 4px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    
    /* 項目追加エリア */
    .add-item-box {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .add-item-box input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .note {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
      line-height: 1.5;
    }
    
    /* ビンゴカード表示エリア（中央寄せ固定） */
    .card-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 20px;
    }

    .bingo-card {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 1 / 1;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      user-select: none;
      margin: 0 auto;
    }
    
    /* 5x5用 */
    .bingo-card.mode-5x5 {
      background-image: url('bingo1.png');
    }

    .bingo-card.mode-5x5 .grid-overlay {
      top: 15.2%;
      left: 12.8%;
      width: 74.4%;
      height: 70.2%;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 1.5%;
    }

    /* 4x4用 */
    .bingo-card.mode-4x4 {
      background-image: url('bingo2.png');
    }

    .bingo-card.mode-4x4 .grid-overlay {
      top: 15.5%;
      left: 12.5%;
      width: 72.0%;
      height: 64.0%;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 2.0%;
    }

    /* マスの中に少しだけ内側余白を作って画像を透過させる */
    .bingo-card.mode-4x4 .cell {
      margin: 2px;     /* マスの枠線にかぶらないよう少し小さくする */
    }

    .grid-overlay {
      position: absolute;
      display: grid;
      box-sizing: border-box;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2px;
      font-size: clamp(7px, 1.6vw, 11px);
      font-weight: bold;
      color: #222;
      line-height: 1.15;
      word-break: break-all;
      cursor: pointer;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .cell.checked::after {
      content: "★";
      position: absolute;
      inset: 0;
      background: rgba(255, 64, 129, 0.65);
      border: 3px solid #ff0055;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: clamp(18px, 4vw, 28px);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }

    @media print {
      .controls { display: none; }
      body { background: white; padding: 0; }
      .bingo-card { max-width: 100%; }
    }
  </style>
</head>
<body>

  <h1>スプラ風 ビンゴカード生成器</h1>

  <div class="controls">
    <div class="options">
      <div>
        <label for="mode-select" style="font-weight:bold;">サイズ:</label>
        <select id="mode-select" onchange="generateBingo()">
          <option value="5x5">5×5（25マス - bingo1.png）</option>
          <option value="4x4">4×4（16マス - bingo2.png）</option>
        </select>
      </div>

      <div id="free-option-group">
        <label style="font-weight:bold;"><input type="checkbox" id="use-free" checked onchange="generateBingo()"> 中央をFREEにする</label>
      </div>

      <button onclick="generateBingo()">シャッフルして生成</button>
      <button class="btn-secondary" onclick="setAllCheckboxes(true)">全チェック</button>
      <button class="btn-secondary" onclick="setAllCheckboxes(false)">全解除</button>
    </div>

    <div>
      <label style="font-weight:bold; display:block; margin-bottom:5px;">マスに入れる項目（□でレ点オンオフ / 数字指定可能）:</label>

      <!-- 新規項目追加 -->
      <div class="add-item-box">
        <input type="text" id="new-item-text" placeholder="新しい項目を入力...（例: ガジェット縛り[ガジェット]）">
        <button type="button" onclick="addNewItem()">項目を追加</button>
      </div>

      <div id="item-list-container" class="item-list-container">
        <!-- JSで項目行を自動生成 -->
      </div>

      <div class="note">
        ※ <code>[武器種]</code> は「【シューター】」などのランダムな武器種になります。<br>
        ※ <code>[ガジェット]</code> は「【スピードタンク】」「【パワータンク】」「【テクニカルタンク】」のランダムになります。<br>
        ※ <code>[欠片]</code> は「5000?10000」のランダムな個数になります。<br>
        ※ <code>[ランク]</code> は「A」「B」「C」のランダムになります。<br>
        ※ チェックを入れた項目（?）のみがビンゴカードの作成に使用されます。
      </div>
    </div>
  </div>

  <div class="card-wrapper">
    <div id="bingo-card" class="bingo-card mode-5x5">
      <div id="grid-overlay" class="grid-overlay"></div>
    </div>
  </div>

  <script>
    let itemList = [
      { id: 1, text: "★5武器", count: 1, type: "weapon_count", suffix: "本獲得 [武器種]", checked: true },
      { id: 2, text: "★5絶品武器", count: 2, type: "weapon_count", suffix: "本獲得 [武器種]", checked: true },
      { id: 3, text: "★5絶品武器", count: 3, type: "weapon_count", suffix: "本獲得 [武器種]", checked: true },
      { id: 4, text: "ガジェット縛り[ガジェット]", type: "normal", checked: true },
      { id: 5, text: "クリスタルの欠片[欠片]個集める", type: "normal", checked: true },
      { id: 6, text: "ミニゲームで[ランク]をとる", type: "normal", checked: true },
      { id: 7, text: "[武器種]でステージクリア", type: "normal", checked: true },
      { id: 8, text: "[武器種]で１０キル", type: "normal", checked: true },
      { id: 9, text: "アンナン巣窟４０秒以内クリア", type: "normal", checked: true },
      { id: 10, text: "幻のシャケ３体討伐", type: "normal", checked: true },
      { id: 11, text: "★1武器縛り【武器種は自由】", type: "normal", checked: true },
      { id: 12, text: "味方をナイスで応援", type: "normal", checked: true },
      { id: 13, text: "★１[武器種]で敵を撃破", type: "normal", checked: true },
      { id: 14, text: "★２[武器種]で敵を撃破", type: "normal", checked: true },
      { id: 15, text: "イカロールで敵を落とす", type: "normal", checked: true },
      { id: 16, text: "イカロールアタックのみで１体倒す", type: "normal", checked: true },
      { id: 17, text: "ウズシオクリスタル１０個獲得", type: "normal", checked: true },
      { id: 18, text: "つまみぐいダンジョン１ステージクリア", type: "normal", checked: true },
      { id: 19, text: "フルコーススピードの極味の攻略", type: "normal", checked: true },
      { id: 20, text: "フルコーステクニカルの極味の攻略", type: "normal", checked: true },
      { id: 21, text: "フルコースパワーの極味の攻略", type: "normal", checked: true },
      { id: 22, text: "デカ結晶１回クリア", type: "normal", checked: true },
      { id: 23, text: "キワモノシャケ１０体討伐", type: "normal", checked: true },
      { id: 24, text: "★３[武器種]で敵を撃破", type: "normal", checked: true },
      { id: 25, text: "★４[武器種]で敵を撃破", type: "normal", checked: true },
      { id: 26, text: "★５[武器種]で敵を撃破", type: "normal", checked: true },
      { id: 27, text: "ウデジマン６体討伐", type: "normal", checked: true },
      { id: 28, text: "無限食堂１０回分制覇", type: "normal", checked: true }
    ];

    const WEAPON_TYPES = [
      '【シューター】', '【ローラー】', '【チャージャー】', '【スロッシャー】',
      '【スピナー】', '【マニューバー】', '【シェルター】', '【ブラスター】',
      '【フデ】', '【ストリンガー】', '【ワイパー】'
    ];

    const GADGET_TYPES = [
      '【スピードタンク】', '【パワータンク】', '【テクニカルタンク】'
    ];

    // 入力フォームの生成
    function renderItemList() {
      const container = document.getElementById('item-list-container');
      container.innerHTML = '';

      itemList.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'item-row';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.checked;
        checkbox.addEventListener('change', (e) => {
          item.checked = e.target.checked;
        });

        row.appendChild(checkbox);

        if (item.type === 'weapon_count') {
          const label1 = document.createElement('span');
          label1.textContent = item.text || '★5武器';
          
          const numInput = document.createElement('input');
          numInput.type = 'number';
          numInput.className = 'num-input';
          numInput.value = item.count;
          numInput.min = 1;
          numInput.max = 99;
          numInput.addEventListener('input', (e) => {
            item.count = e.target.value;
          });

          const label2 = document.createElement('span');
          label2.textContent = (item.suffix || '');

          row.appendChild(label1);
          row.appendChild(numInput);
          row.appendChild(label2);
        } else {
          const textInput = document.createElement('input');
          textInput.type = 'text';
          textInput.value = item.text;
          textInput.addEventListener('input', (e) => {
            item.text = e.target.value;
          });

          row.appendChild(textInput);
        }

        container.appendChild(row);
      });
    }

    // 全チェック / 全解除 ボタン
    function setAllCheckboxes(status) {
      itemList.forEach(item => item.checked = status);
      renderItemList();
    }

    // 新規項目追加
    function addNewItem() {
      const input = document.getElementById('new-item-text');
      const val = input.value.trim();
      if (!val) return;

      itemList.push({
        id: Date.now(),
        text: val,
        type: "normal",
        checked: true
      });

      input.value = '';
      renderItemList();
    }

    // 特殊タグ（[武器種] [ガジェット] [欠片] [ランク]）を置換
    function parseTags(text) {
      // [武器種] の置換
      text = text.replace(/\[武器種\]/g, () => {
        const randomIndex = Math.floor(Math.random() * WEAPON_TYPES.length);
        return WEAPON_TYPES[randomIndex];
      });

      // [ガジェット] の置換
      text = text.replace(/\[ガジェット\]/g, () => {
        const randomIndex = Math.floor(Math.random() * GADGET_TYPES.length);
        return GADGET_TYPES[randomIndex];
      });

      // [欠片] の置換 (5000?10000)
      text = text.replace(/\[欠片\]/g, () => {
        const min = 5000;
        const max = 10000;
        const count = Math.floor(Math.random() * (max - min + 1)) + min;
        return count;
      });

      // [ランク] の置換 (A, B, C)
      text = text.replace(/\[ランク\]/g, () => {
        const ranks = ['A', 'B', 'C'];
        const randomIndex = Math.floor(Math.random() * ranks.length);
        return ranks[randomIndex];
      });

      return text;
    }

    // ビンゴカードの生成
    function generateBingo() {
      const mode = document.getElementById('mode-select').value;
      const useFree = document.getElementById('use-free').checked;
      const card = document.getElementById('bingo-card');
      const grid = document.getElementById('grid-overlay');
      const freeGroup = document.getElementById('free-option-group');

      if (mode === '4x4') {
        card.className = 'bingo-card mode-4x4';
        freeGroup.style.display = 'none';
      } else {
        card.className = 'bingo-card mode-5x5';
        freeGroup.style.display = 'block';
      }

      // チェック済みの項目のみ抽出
      const selectedItems = [];
      itemList.forEach(item => {
        if (item.checked) {
          if (item.type === 'weapon_count') {
            const num = item.count || 1;
            const suffix = item.suffix || '';
            selectedItems.push(`${item.text}${num}${suffix}`);
          } else {
            if (item.text.trim().length > 0) {
              selectedItems.push(item.text.trim());
            }
          }
        }
      });

      const totalCells = mode === '5x5' ? 25 : 16;
      const isFreeActive = (mode === '5x5' && useFree);
      const neededItems = isFreeActive ? totalCells - 1 : totalCells;

      if (selectedItems.length < neededItems) {
        alert(`チェックされている項目が足りません。\n${mode}モードでは最低${neededItems}個にチェックを入れてください。（現在: ${selectedItems.length}個）`);
        return;
      }

      // シャッフル
      const shuffled = [...selectedItems];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      grid.innerHTML = '';
      let itemIdx = 0;

      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');

        if (isFreeActive && i === 12) {
          cell.textContent = 'FREE';
          cell.style.color = '#ff4081';
          cell.style.fontSize = 'clamp(11px, 2.5vw, 16px)';
        } else {
          cell.textContent = parseTags(shuffled[itemIdx]);
          itemIdx++;
        }

        cell.addEventListener('click', () => {
          cell.classList.toggle('checked');
        });

        grid.appendChild(cell);
      }
    }

    // 初期化
    renderItemList();
    generateBingo();
  </script>
</body>
</html>
